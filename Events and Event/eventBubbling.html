<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
         *{
            box-sizing: border-box;
         }
         body{
            margin: 0;
            padding: 0;
         }
        .child{
            background-color: aliceblue;
            border: 2px solid black;
            /* padding: 44px; */
            /* margin:44px; */
            /* width: 100%; */
            height: 43vh;

            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .child img{
            width: 27vh;
            height: 27vh;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid black ;
        }
        .childContainer{
            background-color: rgb(94, 8, 181);
           height: 66vh;
           display: flex;
           justify-content: center;
           align-items: center;
            padding: 30px;
            /* margin: 44px; */

        }
        .container{
           height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(215, 234, 15);
            border: 2px solid black;
            padding: 30px;
            margin: 44px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">
                <img src="IMG-20260204-WA0025.jpg" alt="" srcset="">
            </div>
        </section>
    </div>

    <script>
        document.querySelector(".child").addEventListener("click", (e)=>{
             e.stopPropagation()                  
            alert("Child Was Clicked")
        })

         document.querySelector(".childContainer").addEventListener("click",(e)=>{
             e.stopPropagation()       
            alert("ChildContainer Was Clicked")
        })

         document.querySelector(".container").addEventListener("click",(e)=>{
              e.stopPropagation()
            alert("Container Was Clicked")
        })
            function getRandomColor(){
                let val1 =Math.ceil(0 + Math.random() *255);
                let val2 =Math.ceil(0 + Math.random() *255);
                let val3 =Math.ceil(0 + Math.random() *255);
                return `rgb(${val1}, ${val2}, ${val3})`
            }


        setInterval(() => {
            document.querySelector(".childContainer").style.background = getRandomColor()
            
        }, 1000);
        
        setInterval(() => {
            document.querySelector(".child").style.background = getRandomColor()
            
        }, 1000);
  
        setInterval(() => {
            document.querySelector(".container").style.background = getRandomColor()
            
        }, 1000);

        
    </script>
</body>
</html>
